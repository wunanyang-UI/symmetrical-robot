<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f5f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="账本">
<meta name="description" content="一个只存在你浏览器里的月度开销账本：记一笔、看分类、管预算。不联网、不上传。">
<title>月度开销账本</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐷</text></svg>">
<style>
  *{box-sizing:border-box}
  :root{
    --bg:#f4f5f7; --card:#fff; --ink:#1d232b; --ink2:#6b7580;
    --line:#e9ecf1; --accent:#2f6df6; --danger:#e35169; --radius:16px;
  }
  [hidden]{display:none!important}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink); padding:22px 16px 64px;
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%;
  }
  .app{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
  button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:0 1px 2px rgba(20,30,50,.03)}

  /* header */
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 4px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px}
  .logo{width:36px;height:36px;border-radius:11px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700;font-size:17px;flex:0 0 auto}
  h1{font-size:16.5px;margin:0;font-weight:650;letter-spacing:.2px}
  .sub{margin:0;font-size:12px;color:var(--ink2)}
  .tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .ghost{font-size:12px;color:var(--ink2);padding:6px 10px;border-radius:9px;background:#fff;border:1px solid var(--line);white-space:nowrap}
  .ghost:hover{color:var(--ink);border-color:#d5dce6}
  .ghost:disabled{opacity:.4;cursor:default;border-color:var(--line);color:var(--ink2)}
  .primary{background:var(--accent);color:#fff;font-weight:600;padding:11px 20px;border-radius:12px;font-size:14px}
  .primary:active{transform:scale(.985)}

  /* month bar */
  .monthbar{display:flex;align-items:center;justify-content:space-between;padding:6px 8px}
  .nav{width:38px;height:38px;border-radius:11px;font-size:20px;color:var(--ink2);display:grid;place-items:center;line-height:1}
  .nav:hover{background:#f1f3f6;color:var(--ink)}
  .nav:disabled{opacity:.25;cursor:default}
  .nav:disabled:hover{background:none;color:var(--ink2)}
  #monthText{font-weight:600;font-size:15px;cursor:pointer;padding:4px 10px;border-radius:9px}
  #monthText:hover{background:#f4f6f9}

  /* overview */
  .overview{display:flex;flex-direction:column;gap:10px}
  .big{font-size:40px;font-weight:700;letter-spacing:-1.2px;line-height:1.05;font-variant-numeric:tabular-nums}
  .big .cur{font-size:21px;font-weight:600;margin-right:3px;color:var(--ink2);letter-spacing:0}
  .overview.over .big, .overview.over .big .cur{color:var(--danger)}
  .meta{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--ink2);flex-wrap:wrap}
  .binput{width:4.8em;font:inherit;font-size:13px;color:var(--ink);font-weight:600;border:0;border-bottom:1px dashed #c9d1db;background:transparent;padding:0 2px;outline:none;text-align:left}
  .binput:focus{border-bottom-color:var(--accent)}
  .bar{height:8px;border-radius:99px;background:#eef1f5;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .4s cubic-bezier(.2,.7,.3,1)}
  .overview.over .bar i{background:var(--danger)}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid var(--line);padding-top:12px;margin-top:2px}
  .stats>div{display:flex;flex-direction:column;gap:1px;min-width:0}
  .stats em{font-style:normal;font-weight:650;font-size:15px;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .stats span{font-size:11.5px;color:var(--ink2)}

  /* add */
  #openForm{width:100%;display:flex;align-items:center;justify-content:center;gap:6px;padding:13px;border-radius:12px;border:1px dashed #ccd4df;color:var(--accent);font-weight:600;background:#f8fafd}
  #openForm:hover{background:#f1f5fd;border-color:var(--accent)}
  .amount-row{display:flex;align-items:baseline;gap:6px;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:14px}
  .amount-row .yuan{font-size:22px;color:var(--ink2);font-weight:600}
  #amount{flex:1;border:0;outline:none;font:inherit;font-size:32px;font-weight:700;padding:0;background:transparent;font-variant-numeric:tabular-nums;min-width:0}
  .cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
  .chip{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px;border-radius:11px;border:1px solid var(--line);background:#fbfcfd;font-size:12px;color:var(--ink2)}
  .chip .ic{font-size:17px;line-height:1.2}
  .chip[aria-pressed="true"]{border-color:var(--c);color:var(--c);background:#fff;font-weight:600;box-shadow:inset 0 0 0 1px var(--c)}
  .row2{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .row2 input{font:inherit;font-size:14px;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:#fbfcfd;outline:none;color:var(--ink);min-width:0}
  .row2 input:focus{border-color:var(--accent);background:#fff}
  #date{flex:0 0 145px}
  #note{flex:1 1 170px}
  .form-actions{display:flex;gap:8px;justify-content:flex-end}

  /* breakdown */
  .breakdown{display:flex;gap:22px;align-items:center}
  .donut-wrap{position:relative;width:140px;height:140px;flex:0 0 140px}
  .donut{width:140px;height:140px;display:block}
  .donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;line-height:1.2}
  .donut-center b{font-size:21px;font-weight:700;letter-spacing:-.5px}
  .donut-center small{font-size:10.5px;color:var(--ink2);letter-spacing:.4px}
  .legend{flex:1;display:flex;flex-direction:column;gap:9px;min-width:0}
  .legend-row{display:flex;align-items:center;gap:8px;font-size:13px;min-width:0}
  .dot{width:8px;height:8px;border-radius:3px;flex:0 0 auto}
  .lg-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lg-amt{font-variant-numeric:tabular-nums;font-weight:600}
  .lg-pct{width:42px;text-align:right;color:var(--ink2);font-size:12px;font-variant-numeric:tabular-nums;flex:0 0 auto}

  /* list */
  .list h2{font-size:12.5px;color:var(--ink2);font-weight:600;margin:0 0 2px;letter-spacing:.4px}
  .day-head{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);padding:13px 2px 5px;border-top:1px solid var(--line);margin-top:6px}
  .day-head:first-of-type{border-top:0;margin-top:0;padding-top:6px}
  .rec{display:flex;align-items:center;gap:10px;padding:8px 2px;border-radius:9px;cursor:pointer}
  .rec:hover{background:#f5f7fb}
  .rec .ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:15px;flex:0 0 auto}
  .rec .mid{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.35}
  .rec .rcat{font-size:14px}
  .rec .rnote{font-size:12px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rec .amt{font-variant-numeric:tabular-nums;font-weight:600;font-size:14.5px;flex:0 0 auto}
  .rec .del{width:26px;height:26px;border-radius:8px;color:#c3cad4;font-size:17px;line-height:1;opacity:.45;transition:opacity .15s,background .15s;flex:0 0 auto;display:grid;place-items:center}
  .rec:hover .del{opacity:1}
  .rec .del:hover{background:#fdeef1;color:var(--danger)}
  @media(hover:none){.rec .del{opacity:.55}}

  .empty{text-align:center;color:#9aa4b1;font-size:13px;padding:30px 0 26px}
  .foot{text-align:center;color:#a2abb7;font-size:11.5px;line-height:1.7;padding:4px 8px 0}

  #toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);background:#1d232b;color:#fff;font-size:13px;padding:10px 16px;border-radius:11px;opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;display:flex;gap:14px;align-items:center;z-index:9;max-width:92vw;box-shadow:0 8px 24px rgba(20,30,50,.18)}
  #toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
  #toast button{color:#8fb4ff;font-weight:600;font-size:13px;white-space:nowrap}

  @media(max-width:560px){
    body{padding:16px 12px 60px}
    .breakdown{flex-direction:column;align-items:stretch;gap:16px}
    .donut-wrap{align-self:center}
    .big{font-size:34px}
    .brand .sub{display:none}
    h1{font-size:15px}
    .tools{width:100%;justify-content:flex-start}
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="brand">
      <span class="logo">¥</span>
      <div>
        <h1>月度开销账本</h1>
        <p class="sub">数据只保存在这台设备的浏览器里</p>
      </div>
    </div>
    <div class="tools">
      <button class="ghost" id="btnUndo" disabled>↶ 撤销</button>
      <button class="ghost" id="btnCsv">导出 CSV</button>
      <button class="ghost" id="btnExport">备份</button>
      <button class="ghost" id="btnImport">恢复</button>
    </div>
  </header>

  <section class="card monthbar">
    <button class="nav" id="prevMonth" aria-label="上个月">‹</button>
    <span id="monthText" title="点一下回到本月"></span>
    <button class="nav" id="nextMonth" aria-label="下个月">›</button>
  </section>

  <section class="card overview" id="overview">
    <div class="big"><span class="cur">¥</span><span id="total">0.00</span></div>
    <div class="meta">
      <span>预算 ¥<input class="binput" id="budgetInput" type="text" inputmode="decimal" aria-label="这个月的预算"> 元</span>
      <span id="remainText">还可花 0.00</span>
    </div>
    <div class="bar"><i id="barFill"></i></div>
    <div class="stats">
      <div><em id="statAvg">0.00</em><span>日均</span></div>
      <div><em id="statCount">0</em><span>笔数</span></div>
      <div><em id="statTop">—</em><span>主要去向</span></div>
    </div>
  </section>

  <section class="card add">
    <button id="openForm">＋ 记一笔</button>
    <form id="form" hidden>
      <div class="amount-row">
        <span class="yuan">¥</span>
        <input id="amount" type="text" inputmode="decimal" placeholder="0.00" autocomplete="off" aria-label="金额">
      </div>
      <div class="cat-grid" id="catGrid"></div>
      <div class="row2">
        <input id="date" type="date" aria-label="日期">
        <input id="note" type="text" maxlength="30" placeholder="备注（可选，比如 食堂午饭）" aria-label="备注">
      </div>
      <div class="form-actions">
        <button type="button" class="ghost" id="cancelBtn">取消</button>
        <button type="submit" class="primary" id="saveBtn">保存</button>
      </div>
    </form>
  </section>

  <section class="card breakdown" id="breakdown" hidden>
    <div class="donut-wrap">
      <svg class="donut" id="donut" viewBox="0 0 140 140"></svg>
      <div class="donut-center"><b id="donutPct">0%</b><small>已用预算</small></div>
    </div>
    <div class="legend" id="legend"></div>
  </section>

  <section class="card list">
    <h2>明细</h2>
    <div id="listWrap"></div>
  </section>

  <p class="foot">换电脑、换浏览器或清除浏览数据会丢账，记得偶尔点一下「备份」。<br>导出 CSV 可以直接用 Excel / Numbers 打开。</p>
</div>

<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fileInput" accept=".json,application/json" hidden>

<script>
(function () {
  'use strict';

  /* ---------- 分类 ---------- */
  var CATS = [
    { id: 'food',      name: '餐饮',   icon: '🍜', color: '#E8785A' },
    { id: 'transport', name: '交通',   icon: '🚌', color: '#5B9BD5' },
    { id: 'study',     name: '学习',   icon: '📚', color: '#7C6BD6' },
    { id: 'tech',      name: '数码',   icon: '💻', color: '#3FA796' },
    { id: 'social',    name: '社交',   icon: '🍻', color: '#E0A030' },
    { id: 'health',    name: '健康',   icon: '🏃', color: '#58B368' },
    { id: 'save',      name: '存起来', icon: '🐷', color: '#C9739A' },
    { id: 'other',     name: '其他',   icon: '✨', color: '#9AA3AD' }
  ];
  var CATMAP = {};
  CATS.forEach(function (c) { CATMAP[c.id] = c; });
  function getCat(id) { return CATMAP[id] || CATMAP.other; }

  var DEFAULT_BUDGET = 1000;
  var KEY = 'ledger.v1';

  /* ---------- 工具 ---------- */
  function $(id) { return document.getElementById(id); }
  function pad2(n) { return n < 10 ? '0' + n : String(n); }
  function monthOfDate(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1); }
  function monthOfStr(s) { return String(s).slice(0, 7); }
  function todayStr() { var d = new Date(); return monthOfDate(d) + '-' + pad2(d.getDate()); }
  function fmt(n) {
    return Number(n).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function uid() {
    return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
  }
  function parseAmount(v) {
    var s = String(v || '')
      .replace(/[\uff10-\uff19]/g, function (ch) { return String.fromCharCode(ch.charCodeAt(0) - 0xfee0); })
      .replace(/\uff0e/g, '.')
      .replace(/[,，\s]/g, '')
      .replace(/[^\d.]/g, '');
    var n = parseFloat(s);
    return isFinite(n) ? n : 0;
  }

  /* ---------- 存储 ---------- */
  function load() {
    var base = { records: [], budgets: {}, lastCat: 'food' };
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return base;
      var s = JSON.parse(raw);
      if (!s || typeof s !== 'object') return base;
      var recs = Array.isArray(s.records) ? s.records.filter(function (r) {
        return r && r.date && typeof r.amount === 'number' && isFinite(r.amount);
      }) : [];
      return {
        records: recs,
        budgets: (s.budgets && typeof s.budgets === 'object') ? s.budgets : {},
        lastCat: CATMAP[s.lastCat] ? s.lastCat : 'food'
      };
    } catch (e) { return base; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch (e) { toast('保存失败：浏览器不让写本地存储'); }
  }

  var state = load();
  var viewMonth = monthOfDate(new Date());
  var selectedCat = state.lastCat;

  function budgetOf(m) {
    var b = state.budgets[m];
    return (typeof b === 'number' && isFinite(b) && b >= 0) ? b : DEFAULT_BUDGET;
  }

  /* ---------- 元素 ---------- */
  var $monthText = $('monthText'), $prev = $('prevMonth'), $next = $('nextMonth');
  var $total = $('total'), $budgetInput = $('budgetInput'), $remain = $('remainText');
  var $bar = $('barFill'), $avg = $('statAvg'), $count = $('statCount'), $top = $('statTop');
  var $overview = $('overview'), $breakdown = $('breakdown');
  var $donut = $('donut'), $donutPct = $('donutPct'), $legend = $('legend');
  var $listWrap = $('listWrap');
  var $openForm = $('openForm'), $form = $('form'), $amount = $('amount');
  var $catGrid = $('catGrid'), $date = $('date'), $note = $('note');
  var $toast = $('toast'), $file = $('fileInput');
  var $saveBtn = $('saveBtn'), $undo = $('btnUndo');

  /* ---------- 撤销 ---------- */
  var undoStack = [];
  var editingId = null;

  function snapshot() {
    undoStack.push(JSON.stringify(state.records));
    if (undoStack.length > 30) undoStack.shift();
    updateUndo();
  }
  function updateUndo() {
    var n = undoStack.length;
    $undo.disabled = n === 0;
    $undo.title = n ? '撤销上一步（⌘Z / Ctrl+Z）' : '没有可撤销的操作';
  }
  function undo() {
    if (!undoStack.length) { toast('没有可撤销的操作'); return; }
    state.records = JSON.parse(undoStack.pop());
    save(); render(); updateUndo();
    toast('已撤销');
  }

  /* ---------- 渲染 ---------- */
  function render() {
    var now = new Date();
    var curMonth = monthOfDate(now);
    var recs = state.records.filter(function (r) { return monthOfStr(r.date) === viewMonth; });
    var total = recs.reduce(function (a, r) { return a + r.amount; }, 0);
    var budget = budgetOf(viewMonth);
    var parts = viewMonth.split('-');
    var y = Number(parts[0]), m = Number(parts[1]);

    $monthText.textContent = y + ' 年 ' + m + ' 月';
    $next.disabled = viewMonth >= curMonth;

    $total.textContent = fmt(total);
    if (document.activeElement !== $budgetInput) $budgetInput.value = String(budget);

    var pct = budget > 0 ? total / budget * 100 : 0;
    var over = total > budget + 1e-9;
    $overview.classList.toggle('over', over);
    $bar.style.width = Math.min(100, pct).toFixed(2) + '%';
    $remain.textContent = over ? ('超支 ' + fmt(total - budget)) : ('还可花 ' + fmt(budget - total));

    var dim = new Date(y, m, 0).getDate();
    var days = viewMonth === curMonth ? now.getDate() : dim;
    $avg.textContent = fmt(total / Math.max(days, 1));
    $count.textContent = String(recs.length);

    var byCat = {};
    recs.forEach(function (r) {
      var c = getCat(r.cat);
      byCat[c.id] = (byCat[c.id] || 0) + r.amount;
    });
    var segs = Object.keys(byCat).map(function (id) {
      var c = getCat(id);
      return { id: c.id, name: c.name, icon: c.icon, color: c.color, amount: byCat[id] };
    }).filter(function (s) { return s.amount > 0; })
      .sort(function (a, b) { return b.amount - a.amount; });

    $top.textContent = segs.length ? segs[0].name : '—';
    $donutPct.textContent = budget > 0 ? Math.round(pct) + '%' : '—';

    renderDonut(segs, total);
    renderLegend(segs, total);
    renderList(recs);
    $breakdown.hidden = segs.length === 0;
  }

  function renderDonut(segs, total) {
    var R = 54, C = 2 * Math.PI * R;
    var out = '<circle cx="70" cy="70" r="' + R + '" fill="none" stroke="#eef1f4" stroke-width="18"/>';
    if (total > 0) {
      var off = 0;
      segs.forEach(function (s) {
        var len = s.amount / total * C;
        out += '<circle cx="70" cy="70" r="' + R + '" fill="none" stroke="' + s.color + '" stroke-width="18"'
          + ' stroke-dasharray="' + len.toFixed(2) + ' ' + (C - len).toFixed(2) + '"'
          + ' stroke-dashoffset="' + (-off).toFixed(2) + '"'
          + ' transform="rotate(-90 70 70)"><title>' + esc(s.name) + ' ' + fmt(s.amount) + '</title></circle>';
        off += len;
      });
    }
    $donut.innerHTML = out;
  }

  function renderLegend(segs, total) {
    $legend.innerHTML = segs.map(function (s) {
      var p = total > 0 ? Math.round(s.amount / total * 100) : 0;
      return '<div class="legend-row">'
        + '<span class="dot" style="background:' + s.color + '"></span>'
        + '<span class="lg-name">' + s.icon + ' ' + esc(s.name) + '</span>'
        + '<span class="lg-amt">' + fmt(s.amount) + '</span>'
        + '<span class="lg-pct">' + p + '%</span>'
        + '</div>';
    }).join('');
  }

  function renderList(recs) {
    if (!recs.length) {
      $listWrap.innerHTML = '<div class="empty">这个月还没有记账。<br>点上面的「记一笔」开始。</div>';
      return;
    }
    var groups = {};
    recs.forEach(function (r) {
      var d = monthOfStr(r.date) + '-' + String(r.date).slice(8, 10);
      (groups[d] = groups[d] || []).push(r);
    });
    var dates = Object.keys(groups).sort().reverse();
    var html = '';
    dates.forEach(function (d) {
      var p = d.split('-');
      var dd = Number(p[2]);
      var wd = '日一二三四五六'[new Date(Number(p[0]), Number(p[1]) - 1, dd).getDay()];
      var dayTotal = groups[d].reduce(function (a, r) { return a + r.amount; }, 0);
      html += '<div class="day-head"><span>' + Number(p[1]) + ' 月 ' + dd + ' 日　周' + wd
        + '</span><span>' + fmt(dayTotal) + '</span></div>';
      groups[d].slice().reverse().forEach(function (r) {
        var c = getCat(r.cat);
        html += '<div class="rec" data-id="' + esc(r.id) + '" title="点一下改这条">'
          + '<span class="ico" style="background:' + c.color + '1f">' + c.icon + '</span>'
          + '<span class="mid"><span class="rcat">' + esc(c.name) + '</span>'
          + (r.note ? '<span class="rnote">' + esc(r.note) + '</span>' : '')
          + '</span>'
          + '<span class="amt">' + fmt(r.amount) + '</span>'
          + '<button class="del" data-id="' + esc(r.id) + '" title="删除">×</button>'
          + '</div>';
      });
    });
    $listWrap.innerHTML = html;
  }

  /* ---------- 记账 ---------- */
  function findRec(id) {
    for (var i = 0; i < state.records.length; i++) {
      if (state.records[i].id === id) return state.records[i];
    }
    return null;
  }
  function openForm() {
    editingId = null;
    $saveBtn.textContent = '保存';
    $form.hidden = false;
    $openForm.hidden = true;
    var curMonth = monthOfDate(new Date());
    if (monthOfStr($date.value) !== viewMonth) {
      $date.value = viewMonth === curMonth ? todayStr() : viewMonth + '-01';
    }
    selectCat(selectedCat);
    setTimeout(function () { $amount.focus(); }, 30);
  }
  function closeForm() {
    $form.hidden = true;
    $openForm.hidden = false;
    editingId = null;
    $saveBtn.textContent = '保存';
    $amount.value = '';
    $note.value = '';
    if (document.activeElement && document.activeElement.blur && $form.contains(document.activeElement)) {
      document.activeElement.blur();
    }
  }
  function startEdit(id) {
    var rec = findRec(id);
    if (!rec) return;
    openForm();
    editingId = id;
    $saveBtn.textContent = '保存修改';
    $amount.value = rec.amount.toFixed(2);
    $date.value = String(rec.date).slice(0, 10);
    $note.value = rec.note || '';
    selectCat(rec.cat);
    $amount.focus();
    $amount.select();
    if ($form.scrollIntoView) $form.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }
  function selectCat(id) {
    selectedCat = CATMAP[id] ? id : 'other';
    var chips = $catGrid.querySelectorAll('.chip');
    for (var i = 0; i < chips.length; i++) {
      chips[i].setAttribute('aria-pressed', String(chips[i].getAttribute('data-id') === selectedCat));
    }
  }
  function addRecord() {
    var amount = parseAmount($amount.value);
    if (!(amount > 0)) {
      toast('先填个金额');
      $amount.focus();
      return;
    }
    amount = Math.round(amount * 100) / 100;
    var date = $date.value || todayStr();
    var note = $note.value.trim().slice(0, 30);

    if (editingId) {
      var rec = findRec(editingId);
      if (!rec) { closeForm(); return; }
      snapshot();
      rec.amount = amount;
      rec.date = date;
      rec.cat = selectedCat;
      rec.note = note;
      state.lastCat = selectedCat;
      save();
      if (monthOfStr(date) !== viewMonth) viewMonth = monthOfStr(date);
      render();
      closeForm();
      toast('已改成 ¥' + fmt(amount), { label: '撤销', run: undo });
      return;
    }

    snapshot();
    state.records.push({
      id: uid(),
      date: date,
      cat: selectedCat,
      amount: amount,
      note: note,
      t: Date.now()
    });
    state.lastCat = selectedCat;
    save();
    if (monthOfStr(date) !== viewMonth) viewMonth = monthOfStr(date);
    render();
    $amount.value = '';
    $note.value = '';
    $amount.focus();
    toast('已记一笔 ¥' + fmt(amount), { label: '撤销', run: undo });
  }
  function delRecord(id) {
    var i = -1;
    for (var k = 0; k < state.records.length; k++) {
      if (state.records[k].id === id) { i = k; break; }
    }
    if (i < 0) return;
    snapshot();
    state.records.splice(i, 1);
    save(); render();
    toast('已删除', { label: '撤销', run: undo });
  }

  /* ---------- 提示 ---------- */
  var toastTimer = null;
  function hideToast() { $toast.classList.remove('show'); }
  function toast(msg, action) {
    $toast.innerHTML = '';
    var s = document.createElement('span');
    s.textContent = msg;
    $toast.appendChild(s);
    if (action) {
      var b = document.createElement('button');
      b.textContent = action.label;
      b.addEventListener('click', function () { action.run(); hideToast(); });
      $toast.appendChild(b);
    }
    $toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, action ? 5000 : 2000);
  }

  /* ---------- 导入导出 ---------- */
  function download(blob, name) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
  }
  function exportCsv() {
    var recs = state.records.filter(function (r) { return monthOfStr(r.date) === viewMonth; })
      .sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
    if (!recs.length) { toast('这个月还没有记录'); return; }
    var rows = [['日期', '分类', '金额', '备注']];
    recs.forEach(function (r) {
      rows.push([r.date, getCat(r.cat).name, r.amount.toFixed(2), r.note || '']);
    });
    var csv = '\ufeff' + rows.map(function (row) {
      return row.map(function (cell) {
        var s = String(cell);
        return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      }).join(',');
    }).join('\r\n');
    download(new Blob([csv], { type: 'text/csv;charset=utf-8' }), '账本-' + viewMonth + '.csv');
    toast('已导出 ' + recs.length + ' 条');
  }
  function exportJson() {
    var data = { app: 'ledger', version: 1, exportedAt: new Date().toISOString(), records: state.records, budgets: state.budgets };
    download(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }), '账本备份-' + todayStr() + '.json');
    toast('已备份 ' + state.records.length + ' 条');
  }
  function importJson(file) {
    var fr = new FileReader();
    fr.onload = function () {
      var s;
      try { s = JSON.parse(String(fr.result)); }
      catch (e) { toast('这个文件读不出来，格式不对'); return; }
      var recs = Array.isArray(s) ? s : (s && Array.isArray(s.records) ? s.records : null);
      if (!recs) { toast('文件里没有找到记录列表'); return; }
      var have = {};
      state.records.forEach(function (r) { have[r.id] = true; });
      var added = 0;
      recs.forEach(function (r) {
        if (!r || !r.date || typeof r.amount !== 'number' || !isFinite(r.amount)) return;
        var id = r.id ? String(r.id) : uid();
        if (have[id]) return;
        state.records.push({
          id: id,
          date: String(r.date).slice(0, 10),
          cat: CATMAP[r.cat] ? r.cat : 'other',
          amount: Math.round(r.amount * 100) / 100,
          note: String(r.note || '').slice(0, 30),
          t: r.t || Date.now()
        });
        have[id] = true;
        added++;
      });
      if (s && s.budgets && typeof s.budgets === 'object') {
        Object.keys(s.budgets).forEach(function (k) {
          var v = s.budgets[k];
          if (typeof v === 'number' && isFinite(v) && v >= 0) state.budgets[k] = v;
        });
      }
      save(); render();
      toast(added ? ('已导入 ' + added + ' 条') : '没有新记录（都已存在）');
    };
    fr.readAsText(file);
  }

  /* ---------- 事件 ---------- */
  $catGrid.innerHTML = CATS.map(function (c) {
    return '<button type="button" class="chip" data-id="' + c.id + '" style="--c:' + c.color
      + '" aria-pressed="false"><span class="ic">' + c.icon + '</span>' + c.name + '</button>';
  }).join('');

  $catGrid.addEventListener('click', function (e) {
    var b = e.target.closest('.chip');
    if (b) selectCat(b.getAttribute('data-id'));
  });
  $openForm.addEventListener('click', openForm);
  $('cancelBtn').addEventListener('click', closeForm);
  $form.addEventListener('submit', function (e) { e.preventDefault(); addRecord(); });
  $listWrap.addEventListener('click', function (e) {
    var del = e.target.closest('.del');
    if (del) { e.stopPropagation(); delRecord(del.getAttribute('data-id')); return; }
    var row = e.target.closest('.rec');
    if (row) startEdit(row.getAttribute('data-id'));
  });
  $prev.addEventListener('click', function () {
    var p = viewMonth.split('-');
    viewMonth = monthOfDate(new Date(Number(p[0]), Number(p[1]) - 2, 1));
    render();
  });
  $next.addEventListener('click', function () {
    var p = viewMonth.split('-');
    viewMonth = monthOfDate(new Date(Number(p[0]), Number(p[1]), 1));
    render();
  });
  $monthText.addEventListener('click', function () {
    viewMonth = monthOfDate(new Date());
    render();
  });
  $budgetInput.addEventListener('change', function () {
    if ($budgetInput.value.trim() === '') delete state.budgets[viewMonth];
    else state.budgets[viewMonth] = Math.round(parseAmount($budgetInput.value) * 100) / 100;
    save(); render();
  });
  $budgetInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); $budgetInput.blur(); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !$form.hidden) closeForm();
    var ae = document.activeElement;
    var typing = ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA') && ae.offsetParent !== null;
    if ((e.metaKey || e.ctrlKey) && String(e.key).toLowerCase() === 'z' && $form.hidden && !typing) {
      e.preventDefault();
      undo();
    }
  });
  $undo.addEventListener('click', undo);
  $('btnCsv').addEventListener('click', exportCsv);
  $('btnExport').addEventListener('click', exportJson);
  $('btnImport').addEventListener('click', function () { $file.click(); });
  $file.addEventListener('change', function () {
    if ($file.files && $file.files[0]) importJson($file.files[0]);
    $file.value = '';
  });

  /* ---------- 启动 ---------- */
  render();
  selectCat(state.lastCat);
})();
</script>
</body>
</html>
